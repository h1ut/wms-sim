[package]
name = "warehouse-sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "warehouse-sim"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
futures-util = "0.3"
